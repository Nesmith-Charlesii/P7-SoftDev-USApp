{% extends "base.html" %}

{% block content %}

<style>
    .error-page {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .status_code {
        font-size: 20em;
        color: rgba(75, 75, 75, 0.301);
        line-height: 1;
        margin: 0;
    }

    h2 {
        color: rgba(65, 65, 65, 0.829);
        font-size: 4em;
        margin: 0;
    }

    .message {
        margin-top: 10px;
        color: rgba(0, 0, 0, 0.452);
        font-family: 'calibri', sans-serif;
        font-size: 2.2em;
    }
</style>

<div class="error-page">
    <p class="status_code"><strong>{{ status_code }}</strong></p>
    <h2>Page not found</h2>
    <p class="message"><strong>{{ message }}</strong></p>
    <a href="{{ url_for('index') }}">Back to login</a>
</div>

{% endblock %}
